# Quarkus command-mode CLI (Picocli)
quarkus.banner.enabled=false
quarkus.log.category."io.xion".level=INFO

# Artifact name: native binary is target/xion (no -runner suffix)
quarkus.package.output-name=xion
quarkus.package.jar.add-runner-suffix=false

# Native image: Mandrel/GraalVM 25, no fallback (macOS aarch64 local builds)
quarkus.native.additional-build-args=--no-fallback,-H:+ReportExceptionStackTraces
quarkus.native.march=compatibility

# SQLite persistence (Phase 5) — runtime dir under user home
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${user.home}/.xion/xion.db
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.min-size=1

# Xion runtime defaults (overridable)
xion.runtime-dir=${user.home}/.xion
xion.socket-path=${user.home}/.xion/xion.sock
xion.profiles-dir=/tmp/xion-profiles
# Optional comma-separated absolute paths to create + Seatbelt-allow (prefer --writable-path per container)
# xion.sandbox.extra-writable-paths=
# Port proxy tunables (also -Dxion.proxy.*); userspace copy — not Docker-grade kernel publish
# xion.proxy.max-connections=256
# xion.proxy.accept-backlog=512
