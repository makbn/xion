quarkus.datasource.db-kind=sqlite
# Unique file per surefire fork avoids cross-run collisions on shared /tmp
quarkus.datasource.jdbc.url=jdbc:sqlite:${java.io.tmpdir}/xion-quarkus-test-${quarkus.uuid}.db
quarkus.datasource.jdbc.max-size=2
quarkus.datasource.jdbc.transactions=disabled

xion.runtime-dir=${java.io.tmpdir}/xion-test-runtime-${quarkus.uuid}
xion.socket-path=${java.io.tmpdir}/xion-test-${quarkus.uuid}.sock
xion.profiles-dir=${java.io.tmpdir}/xion-test-profiles-${quarkus.uuid}
# Avoid requiring root for ifconfig lo0 alias during QuarkusTest
xion.network.lo0-aliases=noop
# Use FakeSandboxExecutor so short-lived sleep processes stay controllable under Seatbelt
xion.sandbox=fake
